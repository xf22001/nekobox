name: Build and Upload Artifacts

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Select OS"
        required: true
        default: "ubuntu-22.04"
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest

jobs:
  build:
    runs-on: ${{ github.event.inputs.os }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"

      - name: Clone sing-box repository
        run: |
          git clone --branch module-stable https://${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}@github.com/xf22001/sing-box.git sing-box

      - name: Set environment variables
        run: |
          echo "DEPLOYMENT=$(pwd)/build" >> $GITHUB_ENV
          echo "GOOS=${{ github.event.inputs.os == 'windows-latest' && 'windows' || 'linux' }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "CGO_ENABLED=0" >> $GITHUB_ENV

          echo "TAGS=with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_naive_outbound,with_purego,with_clash_api,with_v2ray_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0" >> $GITHUB_ENV

          pushd sing-box
          echo "GOHOSTOS=$(go env GOHOSTOS)" >> $GITHUB_ENV
          echo "GOHOSTARCH=$(go env GOHOSTARCH)" >> $GITHUB_ENV
          echo "VERSION=$(CGO_ENABLED=0 GOOS=$(go env GOHOSTOS) GOARCH=$(go env GOHOSTARCH) go run ./cmd/internal/read_tag)" >> $GITHUB_ENV
          popd

      - name: Build the project
        run: |
          if [ "$GOOS" == "windows" ]; then
            if [ "$GOARCH" == "amd64" ]; then
              DEST="$DEPLOYMENT/windows64"
            elif [ "$GOARCH" == "arm64" ]; then
              DEST="$DEPLOYMENT/windows-arm64"
            fi
          else
            if [ "$GOARCH" == "amd64" ]; then
              DEST="$DEPLOYMENT/linux64"
            elif [ "$GOARCH" == "arm64" ]; then
              DEST="$DEPLOYMENT/linux-arm64"
            fi
          fi
          
          if [ -z "$DEST" ]; then
              echo "Please set GOOS and GOARCH"
              exit 1
          fi

          mkdir -p "$DEST"

          git config --global --add safe.directory '*'
          CGO_ENABLED=$CGO_ENABLED go build -v -buildvcs=false -o "$DEST/nekobox_core" -trimpath -ldflags "-w -s -checklinkname=0 -X github.com/sagernet/sing-box/constant.Version=$VERSION" -tags "$TAGS" ./cmd/nekobox_core

      - name: Bundle cronet shared library
        run: |
          # with_purego + CGO_ENABLED=0 时 cronet 动态库不会打进二进制，运行时从可执行文件
          # 所在目录加载，必须与 cronet-go 版本配套，否则 naive 出站会段错误
          case "$GOOS/$GOARCH" in
          linux/amd64) DEST="$DEPLOYMENT/linux64"; CRONET_MODULE=linux_amd64; CRONET_LIB=libcronet.so ;;
          linux/arm64) DEST="$DEPLOYMENT/linux-arm64"; CRONET_MODULE=linux_arm64; CRONET_LIB=libcronet.so ;;
          windows/amd64) DEST="$DEPLOYMENT/windows64"; CRONET_MODULE=windows_amd64; CRONET_LIB=libcronet.dll ;;
          windows/arm64) DEST="$DEPLOYMENT/windows-arm64"; CRONET_MODULE=windows_arm64; CRONET_LIB=libcronet.dll ;;
          *)
            echo "Unsupported platform for cronet: $GOOS/$GOARCH"
            exit 1
            ;;
          esac
          go mod download "github.com/sagernet/cronet-go/lib/$CRONET_MODULE"
          CRONET_DIR="$(go list -m -f '{{.Dir}}' "github.com/sagernet/cronet-go/lib/$CRONET_MODULE")"
          cp -f "$CRONET_DIR/$CRONET_LIB" "$DEST/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.os }}-${{ matrix.arch }}
          path: ${{ env.DEPLOYMENT }}
